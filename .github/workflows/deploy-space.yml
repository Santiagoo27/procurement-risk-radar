name: Deploy API to Hugging Face Space

on:
  workflow_dispatch:
    inputs:
      bundle_tag:
        description: "GitHub Release tag holding serving_bundle.tar.gz"
        required: true
        default: "model-2026-11-14"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Download and verify the model bundle
        run: |
          gh release download "${{ inputs.bundle_tag }}" \
            -p serving_bundle.tar.gz -p serving_bundle.sha256
          sha256sum -c serving_bundle.sha256
          tar xzf serving_bundle.tar.gz

      - name: Stage the Space repository
        run: |
          mkdir staging
          cp -r Dockerfile .dockerignore pyproject.toml uv.lock LICENSE src serving_bundle staging/
          cp space/README.md staging/README.md

      - name: Upload to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uvx --from huggingface_hub hf upload "${{ vars.HF_SPACE }}" staging . \
            --repo-type space --commit-message "Deploy ${{ inputs.bundle_tag }}"
