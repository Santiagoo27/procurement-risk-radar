name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run pytest

  docker-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - name: Build demo bundle
        run: uv run python -m procurement_risk demo-bundle --out serving_bundle
      - name: Build image
        run: docker build -t prr-api .
      - name: Run container and call the API
        run: |
          docker run -d --name api -p 7860:7860 prr-api
          for i in $(seq 1 60); do
            curl -fsS localhost:7860/health && break
            sleep 1
          done
          curl -fsS localhost:7860/health
          curl -fsS -X POST localhost:7860/predict \
            -H "Content-Type: application/json" \
            -d '{"contracts":[{"buyer_id":"DEMO-A"}]}' > predict.json
          jq -e '.results[0].value_addition.probability >= 0' predict.json
          jq -e '.results[0].time_extension.probability >= 0' predict.json
      - name: Container logs
        if: always()
        run: docker logs api || true

  render-image-smoke:
    # Builds the production image with the real model bundle from the GitHub Release
    # (pickled on Windows, loaded here on Linux) and calls the API as Render would.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -f Dockerfile.render -t prr-api-render .
      - name: Run container and call the API
        run: |
          docker run -d --name api -e PORT=10000 -p 10000:10000 prr-api-render
          for i in $(seq 1 90); do
            curl -fsS localhost:10000/health && break
            sleep 1
          done
          curl -fsS localhost:10000/health
          curl -fsS "localhost:10000/buyers?q=medellin%20distrito" | tee buyers.json
          jq -e '.[0].buyer_id == "700221021"' buyers.json
          curl -fsS -X POST localhost:10000/predict \
            -H "Content-Type: application/json" \
            -d '{"contracts":[{"buyer_id":"700221021","signed_at":"2025-01-15","award_value":40000000,"planned_duration_days":330}]}' \
            | tee predict.json
          jq -e '.results[0].value_addition.probability > 0' predict.json
          docker stats --no-stream --format "memory: {{.MemUsage}}" api
      - name: Container logs
        if: always()
        run: docker logs api || true

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
