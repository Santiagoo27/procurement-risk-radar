# Render Blueprint: free Docker web service for the prediction API.
# Deploys only after GitHub checks (CI tests + Docker smoke tests) pass on main.
services:
  - type: web
    name: procurement-risk-radar
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile.render
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      # Browsers may call the API only from the demo site and local development.
      # Non-browser clients (curl, Python) are unaffected by CORS.
      - key: ALLOWED_ORIGINS
        value: "https://procurement-risk-radar.vercel.app,http://localhost:5173"
