[project]
name = "procurement-risk"
version = "0.1.0"
description = "Predicting, at signing time, which public contracts will be amended. End-to-end ML on Colombia's SECOP II open data."
authors = [{ name = "Santiagoo27" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "httpx>=0.28.1",
    "joblib>=1.6.0",
    "lightgbm>=4.7.0",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
]

[project.scripts]
procurement-risk = "procurement_risk.__main__:main"

[project.optional-dependencies]
train = [
    "matplotlib>=3.11.2",
    "mlflow>=3.18.0",
]
api = [
    "fastapi>=0.163.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
